<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>casa Point 集計</title>
<style>
/* 見た目は casa POS に合わせる（オーナー指定 2026-11-24）: 濃い青の帯・白いカード・細い線・明るい画面のみ */
:root{
  --bg:#f4f7fb;--card:#fff;--line:#d7e0ec;--line2:#e8eef6;--text:#12233d;--sub:#5b708f;
  --accent:#1f6feb;--accent2:#e8f0fe;--accentD:#134fa8;--on-accent:#fff;
  --ok:#0f7b40;--warn:#c2410c;--bad:#c62828;--badbg:#fdeaea;--in:#fffbea;--auto:#eef2f7;--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  color:var(--text);background:var(--bg);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,.scroll:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header button:focus-visible{outline-color:#fff}

/* 帯 */
header{position:sticky;top:0;z-index:5;background:var(--accentD);color:#fff;display:flex;align-items:center;gap:8px;
  padding:5px 12px;padding-top:calc(5px + env(safe-area-inset-top,0px))}
.ttl{flex:1;min-width:0}
h1{font-size:15px;margin:0;font-weight:700;line-height:1.3;white-space:nowrap}
.sync{font-size:12.5px;line-height:1.3;white-space:nowrap}
.icon-btn{min-width:44px;height:44px;border-radius:9px;background:rgba(255,255,255,.16);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 11px;white-space:nowrap;font-weight:600;font-size:13px}
.icon-btn:active{background:rgba(255,255,255,.3)}
.icon-btn svg{width:20px;height:20px}
.badge{background:#f5b301;color:#2b1d00;border-radius:6px;padding:1px 6px;font-size:12px;font-weight:800}

.wrap{max-width:1180px;margin:0 auto;padding:12px 12px 40px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.panel{padding:12px;margin-bottom:10px;display:grid;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:7px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);
  font-weight:600;font-size:14px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.chip:active{background:var(--accent2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.range{display:flex;align-items:end;gap:8px;flex-wrap:wrap}
.range[hidden]{display:none}
.range label,.srow label{display:grid;gap:3px;font-size:12.5px;color:var(--sub);font-weight:700}
.range .tilde{padding-bottom:10px;color:var(--sub)}
input[type=date],input[type=time]{font:inherit;color:var(--text);min-height:44px;padding:0 10px;border-radius:11px;
  border:1px solid var(--line);background:var(--in);color-scheme:light}
.period-label{font-size:12.5px;color:var(--sub)}

.warn{padding:10px 12px;margin-bottom:10px;color:#8b1e1e;font-weight:700;background:var(--badbg);border-color:#e8a5a5}
.more[hidden],.state[hidden],.warn[hidden]{display:none}

/* 数字のカード */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.card{padding:10px 14px}
.card .k{font-size:12.5px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub);flex:none}
.card .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.3;word-break:break-all}
.card .s{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.t-save{color:var(--accentD)}.t-use{color:var(--warn)}
.d-save{background:var(--accent)}.d-use{background:var(--warn)}
.card.wide .row{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.card.wide .v small{font-size:13px;font-weight:700;color:var(--sub);margin-left:2px}
.neg{color:var(--bad)}.pos{color:var(--ok)}

/* 表 */
.tablebox{padding:12px}
.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.csv{margin-left:auto;min-height:44px;padding:0 16px;border-radius:11px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.csv:active{background:var(--accentD)}
.csv:disabled{background:#dfe7f2;color:#3f5474}
.csv svg{width:18px;height:18px}
.scroll{overflow:auto;max-height:70vh;border-radius:11px;border:1px solid var(--line);background:var(--card)}
.hint{font-size:12.5px;font-weight:700;color:var(--accentD);white-space:nowrap;margin-left:auto}
.hint:not([hidden])+.csv{margin-left:0}
.hint[hidden]{display:none}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line2);background:var(--card)}
th{position:sticky;top:0;z-index:2;background:var(--auto);font-size:12.5px;color:var(--sub);font-weight:700;border-bottom:1px solid var(--line)}
th.l,td.l{text-align:left}
th{padding:0}
.thb{display:block;width:100%;min-height:44px;padding:10px 12px;text-align:inherit;font-weight:700;color:var(--sub);white-space:nowrap}
.thb.on{color:var(--accentD)}
.thb .ar{font-size:13px;color:#64748b}
.thb.on .ar{color:var(--accentD)}
@media (hover:hover){.thb:hover{background:var(--line2)}}
.thb:active{background:var(--line2)}
th:first-child,td:first-child{position:sticky;left:0;z-index:1;font-weight:700}
th:first-child{z-index:3}
tbody tr:nth-child(even) td{background:#f8fafd}
td.memo{white-space:normal;min-width:180px;max-width:320px;text-align:left;color:var(--sub);font-size:13px}
tbody tr.total td{font-weight:800;background:var(--accent2);border-top:2px solid var(--line);border-bottom:0}
.empty{padding:36px 12px;text-align:center;color:var(--sub)}
.more{display:block;width:100%;min-height:44px;margin-top:10px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px}
.state{padding:48px 16px;text-align:center;color:var(--sub)}
.state b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

/* 営業時間 */
.overlay{position:fixed;inset:0;background:rgba(18,35,61,.45);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:10}
.overlay[hidden]{display:none}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:16px}
@media (min-width:700px){.overlay{align-items:center}}
.sheet h2{font-size:17px;margin:0 0 2px}
.sheet .note,.snote{font-size:13px;color:var(--sub);margin:0 0 10px}
.snote{margin:10px 0 0;background:var(--in);border:1px solid #ecd9a8;border-radius:11px;padding:8px 10px;color:var(--text);font-weight:700}
.sconf{margin:10px 0 0;background:var(--accent2);border:1px solid #b5cdf3;border-radius:11px;padding:8px 10px;font-weight:700}
.sconf[hidden]{display:none}
.sconf div{font-variant-numeric:tabular-nums}
.srow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:end;padding:10px 0;border-top:1px dashed var(--line)}
.srow .name{font-weight:800;font-size:16px;align-self:center}
.srow .cut{grid-column:1/-1;font-size:12.5px;color:var(--sub)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn{min-height:48px;padding:0 20px;border-radius:11px;font-weight:700;font-size:15px;background:var(--card);border:1px solid var(--line)}
.btn:active{background:var(--line2)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:active{background:var(--accentD)}
.btn[disabled]{background:#dfe7f2;border-color:var(--line);color:#3f5474}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:1em;font-weight:700}

@media (max-width:520px){
  .wrap{padding:10px 10px 40px}
  .card .v{font-size:20px}
  .cards{grid-template-columns:repeat(2,1fr)}
  .card.wide{grid-column:1/-1}
  .range{display:grid;grid-template-columns:1fr 1fr}
  .range .tilde{display:none}
  .range input{width:100%}
  th,td{padding:9px 10px}
  .tabs>.chips{flex-basis:100%}
}
</style>
</head>
<body>
<header>
  <div class="ttl">
    <h1>casa Point 集計</h1>
    <div class="sync" id="sync"></div>
  </div>
  <button class="icon-btn" id="reload" aria-label="最新にする" title="最新にする">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></svg>
  </button>
  <button class="icon-btn" id="gear" aria-label="営業時間の設定" title="営業時間の設定">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    営業時間<span class="badge" id="kari" hidden>仮</span>
  </button>
</header>
<div class="wrap">

  <div id="loading" class="glass state"><b>読み込み中</b></div>

  <main id="main" hidden>
    <section class="glass panel">
      <div class="chips" id="periods" role="group" aria-label="期間"></div>
      <div class="range" id="range" hidden>
        <label>開始日<input type="date" id="from"></label>
        <span class="tilde">〜</span>
        <label>終了日<input type="date" id="to"></label>
      </div>
      <div class="chips" id="stores" role="group" aria-label="店舗"></div>
      <div class="period-label" id="plabel"></div>
    </section>

    <div class="glass warn" id="warn" role="alert" hidden></div>
    <section class="cards" id="cards"></section>

    <section class="glass tablebox">
      <div class="tabs">
        <div class="chips" id="tabs" role="group" aria-label="表の種類"></div>
        <div class="hint" id="hint" hidden aria-hidden="true">横にスクロール →</div>
        <button class="csv" id="csv" title="表示中の表をCSVで保存">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 20h14"/></svg>CSV
        </button>
      </div>
      <div class="scroll" id="scroll" tabindex="0" aria-label="集計の表（横にスクロールできます）"><table id="table"></table></div>
      <button class="more" id="more" hidden></button>
    </section>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="glass sheet" role="dialog" aria-modal="true" aria-labelledby="st">
    <h2 id="st">営業時間</h2>
    <p class="note">閉店から次の開店までの真ん中で、営業日を切り替えます。</p>
    <div id="srows"></div>
    <p class="snote">保存すると、過去の集計結果も変わる場合があります。</p>
    <div class="sconf" id="sconf" role="alert" hidden></div>
    <div class="err" id="serr" role="alert"></div>
    <div class="actions">
      <button class="btn" id="scancel">閉じる</button>
      <button class="btn primary" id="ssave" disabled>保存</button>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';
var API_URL='https://script.google.com/macros/s/AKfycbyZvSXiegJGumalqTbZnA326goaTWqLxi2FeXjS7jZNMCy23LIqT8lLtYPUxONBbv10/exec';
var EXCLUDE_STORES=['開発テスト'];
// 元データの種別を画面・CSVでの呼び名に直す（オーナー指定 2026-11-24: ためる＝付与、つかう＝使用）
var TYPE_LABEL={'ためる':'付与','つかう':'使用'};
var KNOWN_TYPES=['付与','使用','調整'];
var PERIODS=[['today','今日'],['yesterday','昨日'],['week','今週'],['month','今月'],['lastMonth','先月'],['all','全期間'],['custom','期間指定']];
var TABS=[['day','日別'],['store','店舗別'],['member','会員別'],['detail','明細']];
var PAGE=300;
// 表ごとの最初の並び（dir: 1=小さい順、-1=大きい順）
var SORT_DEFAULT={day:{col:'営業日',dir:-1},store:{col:'店舗',dir:1},member:{col:'件数',dir:-1},detail:{col:'日時',dir:-1}};
var S={raw:[],recs:[],bad:[],settings:{fallback:{open:'13:00',close:'06:00'},stores:{},saved:false},synced:'',
       period:'month',from:'',to:'',store:'all',tab:'day',sort:{},limit:PAGE,view:null};
var $=function(id){return document.getElementById(id);};

/* ---------- 営業日 ---------- */
function toMin(hm){var p=String(hm).split(':');return (+p[0])*60+(+p[1]);}
function fmtMin(m){return Math.floor(m/60)+':'+('0'+(m%60)).slice(-2);}
// 閉店〜次の開店の真ん中（分）。この時刻より前の取引は前の日の営業日。
function boundary(h){
  var o=toMin(h.open),c=toMin(h.close),gap=(o-c+1440)%1440;
  if(gap===0)return o;
  return Math.floor((c+gap/2)%1440);
}
function hoursOf(store){return S.settings.stores[store]||S.settings.fallback;}
function ymd(t){var d=new Date(t);return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2);}
function parseYmd(s){var p=s.split('-');return Date.UTC(+p[0],+p[1]-1,+p[2]);}
function bizDate(y,mo,d,min,store){
  var t=Date.UTC(y,mo-1,d);
  if(min<boundary(hoursOf(store)))t-=86400000;
  return ymd(t);
}
// 数字として読めないものは NaN を返す（0 にして黙って足さない）
function num(s){var t=String(s==null?'':s).replace(/[,\s]/g,'');return /^-?\d+(\.\d+)?$/.test(t)?Number(t):NaN;}
function build(){
  S.recs=[];S.bad=[];
  S.raw.forEach(function(r,i){
    r=r.map(function(x){return x==null?'':String(x);});   // 数字で届いても文字として扱う
    var m=/^(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/.exec(r[0]||'');
    // 日時かチップ数が読めない行は、集計に入れず画面に知らせる
    if(!m||isNaN(num(r[5]))||+m[2]<1||+m[2]>12||+m[3]<1||+m[3]>31||+m[4]>23||+m[5]>59){S.bad.push(r[1]?'取引ID '+r[1]:(i+2)+'行目');return;}
    if(!r[7]||EXCLUDE_STORES.indexOf(r[7])>=0)return;   // 集計に入れない店舗（オーナー指定 2026-11-24）
    S.recs.push({dt:r[0],id:r[1],uid:r[2],nick:r[3],type:TYPE_LABEL[r[4]]||r[4]||'その他',amt:num(r[5]),bal:isNaN(num(r[6]))?'':num(r[6]),
      store:r[7],dev:r[8]||'',memo:r[9]||'',
      biz:bizDate(+m[1],+m[2],+m[3],(+m[4])*60+(+m[5]),r[7]),
      sort:m[1]+('0'+m[2]).slice(-2)+('0'+m[3]).slice(-2)+('0'+m[4]).slice(-2)+m[5]+('0'+(m[6]||'0')).slice(-2)+('0000000000'+(r[1]||'')).slice(-10)});
  });
}
function storeNames(){
  var seen={},out=[];
  S.recs.forEach(function(r){if(!seen[r.store]){seen[r.store]=1;out.push(r.store);}});
  Object.keys(S.settings.stores).forEach(function(n){if(!seen[n]&&n!=='（店舗なし）'&&EXCLUDE_STORES.indexOf(n)<0){seen[n]=1;out.push(n);}});
  return out.sort();
}
function todayBiz(){
  var j=new Date(Date.now()+9*3600000);
  // 全店のときは、どこかの店で始まっている一番新しい営業日を「今日」とする
  var names=S.store!=='all'?[S.store]:storeNames();if(!names.length)names=[''];
  return names.map(function(n){return bizDate(j.getUTCFullYear(),j.getUTCMonth()+1,j.getUTCDate(),j.getUTCHours()*60+j.getUTCMinutes(),n);}).sort().pop();
}
function periodRange(){
  var t=parseYmd(todayBiz()),d=new Date(t),DAY=86400000;
  switch(S.period){
    case 'today':return [ymd(t),ymd(t)];
    case 'yesterday':return [ymd(t-DAY),ymd(t-DAY)];
    case 'week':var w=(d.getUTCDay()+6)%7;return [ymd(t-w*DAY),ymd(t)];
    case 'month':return [ymd(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)),ymd(t)];
    case 'lastMonth':return [ymd(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()-1,1)),ymd(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),0))];
    case 'custom':var a=S.from||ymd(t),b=S.to||ymd(t);return a<=b?[a,b]:[b,a];
    default:return ['0000-00-00','9999-99-99'];
  }
}
function filtered(){
  var p=periodRange();
  return S.recs.filter(function(r){return r.biz>=p[0]&&r.biz<=p[1]&&(S.store==='all'||r.store===S.store);});
}
function typesIn(list){
  var extra=[];
  list.forEach(function(r){if(KNOWN_TYPES.indexOf(r.type)<0&&extra.indexOf(r.type)<0)extra.push(r.type);});
  return KNOWN_TYPES.concat(extra);
}

/* ---------- 集計 ---------- */
function group(list,keyFn,types){
  var map={},order=[];
  list.forEach(function(r){
    var k=keyFn(r),g=map[k];
    if(!g){g=map[k]={key:k,sum:{},net:0,count:0,uids:{},last:r};order.push(g);}
    g.sum[r.type]=(g.sum[r.type]||0)+r.amt;g.net+=r.amt;g.count++;g.uids[r.uid]=1;
    if(r.sort>g.last.sort)g.last=r;
  });
  order.forEach(function(g){g.people=Object.keys(g.uids).length;});
  return order;
}
function makeView(){
  var list=filtered(),types=typesIn(list),tab=S.tab,head,rows,total=null,kinds;
  var tot=group(list,function(){return 'x';},types)[0]||{sum:{},net:0,count:0,people:0};
  function sums(g){return types.map(function(t){return g.sum[t]||0;});}
  if(tab==='detail'){
    head=['日時','営業日','店舗','ニックネーム','種別','チップ数','取引後残高','端末（担当）','メモ','取引ID','会員UID'];
    kinds=['l','l','l','l','l','n','n','l','memo','l','l'];
    rows=list.slice().sort(function(a,b){return a.sort<b.sort?1:-1;}).map(function(r){
      return [r.dt,r.biz,r.store,r.nick,r.type,r.amt,r.bal,r.dev,r.memo,r.id,r.uid];});
  }else if(tab==='member'){
    head=['ニックネーム'].concat(types,['差し引き','件数','期間末の残高','会員UID']);
    kinds=['l'].concat(types.map(function(){return 'n';}),['s','n','n','l']);
    rows=group(list,function(r){return r.uid;},types).sort(function(a,b){return b.count-a.count||(a.last.nick<b.last.nick?-1:1);})
      .map(function(g){return [g.last.nick].concat(sums(g),[g.net,g.count,g.last.bal,g.key]);});
    total=['合計'].concat(sums(tot),[tot.net,tot.count,'','']);
  }else{
    var isDay=tab==='day';
    head=[isDay?'営業日':'店舗'].concat(types,['差し引き','件数','人数']);
    kinds=['l'].concat(types.map(function(){return 'n';}),['s','n','n']);
    rows=group(list,function(r){return isDay?r.biz:r.store;},types)
      .sort(function(a,b){return isDay?(a.key<b.key?1:-1):(a.key<b.key?-1:1);})
      .map(function(g){return [g.key].concat(sums(g),[g.net,g.count,g.people]);});
    total=['合計'].concat(sums(tot),[tot.net,tot.count,tot.people]);
  }
  // 見出しで並べ替え（合計の行は別なので動かない）。最初の並びは今までどおり。
  var d=SORT_DEFAULT[tab],st=S.sort[tab]||d,ci=head.indexOf(st.col);
  if(ci<0){st=d;ci=head.indexOf(d.col);}
  if(st.col===d.col){if(st.dir!==d.dir)rows.reverse();}
  else{
    var isNum=kinds[ci]==='n'||kinds[ci]==='s';
    rows=rows.map(function(r,i){return [r,i];}).sort(function(a,b){
      var x=a[0][ci],y=b[0][ci];
      if(x===''||y==='')return (x===''?1:0)-(y===''?1:0)||a[1]-b[1];   // 空欄は常に下
      var c=isNum?x-y:String(x).localeCompare(String(y),'ja');
      return c*st.dir||a[1]-b[1];
    }).map(function(a){return a[0];});
  }
  return {head:head,kinds:kinds,rows:rows,total:total,types:types,tot:tot,list:list,sort:st};
}

/* ---------- 表示 ---------- */
function nf(n){return Number(n).toLocaleString('ja-JP');}
function signed(n){return (n>0?'+':'')+nf(n);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function chips(box,defs,cur,on){
  box.textContent='';
  defs.forEach(function(d){
    var b=el('button','chip',d[1]);b.type='button';b.setAttribute('aria-pressed',String(d[0]===cur));
    b.onclick=function(){on(d[0]);};box.appendChild(b);
  });
}
function wd(s){return '日月火水木金土'.charAt(new Date(parseYmd(s)).getUTCDay());}
function dayLabel(s){var p=s.split('-');return (+p[1])+'/'+(+p[2])+'（'+wd(s)+'）';}
function cell(v,kind,isDayKey){
  var td=el('td');
  if(kind==='l'||kind==='memo'){td.className=kind;td.textContent=isDayKey?dayLabel(v):v;}
  else if(v===''){td.textContent='';}
  else if(kind==='s'){td.textContent=signed(v);td.className=v<0?'neg':(v>0?'pos':'');}
  else{td.textContent=nf(v);}
  return td;
}
function render(){
  chips($('periods'),PERIODS,S.period,function(k){S.period=k;S.limit=PAGE;render();});
  chips($('stores'),[['all','全店']].concat(storeNames().map(function(n){return [n,n];})),S.store,function(k){S.store=k;S.limit=PAGE;render();});
  chips($('tabs'),TABS,S.tab,function(k){S.tab=k;S.limit=PAGE;render();});
  $('range').hidden=S.period!=='custom';
  var p=periodRange();
  if(S.period==='custom'){$('from').value=p[0];$('to').value=p[1];}
  $('plabel').textContent=(S.period==='all'?'営業日：すべて':
    '営業日：'+p[0].replace(/-/g,'/')+(p[0]===p[1]?'':' 〜 '+p[1].replace(/-/g,'/')))+'　単位：チップ';
  $('from').max=p[1];$('to').min=p[0];
  $('kari').hidden=S.settings.saved;
  $('warn').hidden=!S.bad.length;
  if(S.bad.length)$('warn').textContent='読めない行が'+S.bad.length+'件あり、集計に入っていません（'+S.bad.slice(0,5).join('、')+(S.bad.length>5?' ほか':'')+'）';
  $('sync').textContent='';
  if(S.synced){$('sync').appendChild(el('span','', '最終同期 '));$('sync').appendChild(document.createTextNode(S.synced.replace(/^\d{4}\//,'').replace(/:\d{2}$/,'')));}

  var v=S.view=makeView(),cards=$('cards');cards.textContent='';
  function card(label,value,sub,cls,dot){
    var c=el('div','glass card'),k=el('div','k');
    k.appendChild(el('span','dot '+(dot||'')));k.appendChild(document.createTextNode(label));
    c.appendChild(k);c.appendChild(el('div','v '+(cls||''),value));if(sub)c.appendChild(el('div','s',sub));
    cards.appendChild(c);
  }
  v.types.forEach(function(t){
    var n=v.tot.sum[t]||0,cnt=v.list.filter(function(r){return r.type===t;}).length;
    if(KNOWN_TYPES.indexOf(t)<0&&!cnt)return;
    card(t,t==='付与'?nf(n):signed(n),cnt+'件',t==='付与'?'t-save':(t==='使用'?'t-use':''),t==='付与'?'d-save':(t==='使用'?'d-use':''));
  });
  card('差し引き',signed(v.tot.net),'付与＋使用＋調整',v.tot.net<0?'neg':(v.tot.net>0?'pos':''));
  var w=el('div','glass card wide'),row=el('div','row');
  [['取引件数',v.tot.count,'件'],['会員',v.tot.people||0,'人']].forEach(function(x){
    var b=el('div'),k=el('div','k',x[0]),val=el('div','v',nf(x[1]));val.appendChild(el('small','',x[2]));b.appendChild(k);b.appendChild(val);row.appendChild(b);});
  w.appendChild(row);cards.appendChild(w);

  var table=$('table');table.textContent='';
  if(!v.rows.length){
    table.appendChild(el('caption','empty','この期間の取引はありません'));
    $('more').hidden=true;$('csv').disabled=true;hint();return;
  }
  $('csv').disabled=false;
  var thead=el('thead'),tr=el('tr');
  v.head.forEach(function(h,i){
    var left=v.kinds[i]==='l'||v.kinds[i]==='memo',th=el('th',left?'l':''),on=v.sort.col===h;
    var b=el('button','thb'+(on?' on':''),h+' ');b.type='button';b.appendChild(el('span','ar',on?(v.sort.dir<0?'▼':'▲'):'↕'));
    var num=v.kinds[i]==='n'||v.kinds[i]==='s';
    b.setAttribute('aria-label',h+'で並べ替え'+(on?(v.sort.dir<0?'（今は大きい順）':'（今は小さい順）'):''));
    b.onclick=function(){S.sort[S.tab]={col:h,dir:on?-v.sort.dir:(num?-1:1)};S.limit=PAGE;render();};
    th.setAttribute('aria-sort',on?(v.sort.dir<0?'descending':'ascending'):'none');
    th.appendChild(b);tr.appendChild(th);
  });
  thead.appendChild(tr);table.appendChild(thead);
  var tb=el('tbody'),dayKey=S.tab==='day';
  v.rows.slice(0,S.limit).forEach(function(r){
    var row=el('tr');r.forEach(function(c,i){row.appendChild(cell(c,v.kinds[i],(dayKey&&i===0)||(S.tab==='detail'&&i===1)));});tb.appendChild(row);
  });
  if(v.total){var t=el('tr','total');v.total.forEach(function(c,i){t.appendChild(cell(c,v.kinds[i],false));});tb.appendChild(t);}
  table.appendChild(tb);
  var rest=v.rows.length-S.limit;
  $('more').hidden=rest<=0;
  if(rest>0)$('more').textContent='あと'+nf(rest)+'件を表示';
  hint();
}
function hint(){var s=$('scroll');$('hint').hidden=!(s.scrollWidth-s.clientWidth-s.scrollLeft>4);}

/* ---------- CSV ---------- */
function csvCell(v){
  if(typeof v==='number')return String(v);
  var s=String(v==null?'':v);
  if(/^[=+\-@\t\r]/.test(s))s="'"+s;   // 表計算で数式として動かないようにする
  return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
}
function csvText(v){
  var lines=[v.head].concat(v.rows);if(v.total)lines.push(v.total);
  return '\ufeff'+lines.map(function(r){return r.map(csvCell).join(',');}).join('\r\n')+'\r\n';
}
function downloadCsv(){
  var v=S.view;if(!v||!v.rows.length)return;
  var text=csvText(v);
  var p=periodRange(),tab=TABS.filter(function(t){return t[0]===S.tab;})[0][1];
  var span=S.period==='all'?'全期間':p[0].replace(/-/g,'')+(p[0]===p[1]?'':'-'+p[1].replace(/-/g,''));
  var name='casaPoint_'+(S.store==='all'?'全店':S.store)+'_'+span+'_'+tab+'.csv';
  var url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){a.remove();URL.revokeObjectURL(url);},1000);
}

/* ---------- 設定 ---------- */
function openSettings(){
  var box=$('srows');box.textContent='';$('serr').textContent='';
  storeNames().forEach(function(name){
    var h=hoursOf(name),row=el('div','srow');row.dataset.store=name;
    row.appendChild(el('div','name',name));
    ['open','close'].forEach(function(k){
      var lab=el('label','',k==='open'?'開店':'閉店'),inp=document.createElement('input');
      inp.type='time';inp.value=h[k];inp.dataset.k=k;inp.oninput=function(){upd(row);};
      lab.appendChild(inp);row.appendChild(lab);
    });
    row.appendChild(el('div','cut'));box.appendChild(row);upd(row);
  });
  S.settingsSnap=snap();dirty();
  $('overlay').hidden=false;
}
function rowHours(row){var i=row.querySelectorAll('input');return {open:i[0].value,close:i[1].value};}
function snap(){return JSON.stringify([].map.call($('srows').children,function(r){return rowHours(r);}));}
function dirty(){var d=snap()!==S.settingsSnap||!S.settings.saved;var ch=snap()!==S.settingsSnap;
  $('ssave').disabled=!d;$('scancel').textContent=ch?'キャンセル':'閉じる';
  $('sconf').hidden=true;$('ssave').textContent='保存';S.confirming=false;}
// 切り替え時刻が変わる店を「店 9:30 → 4:00」の形で返す
function cutChanges(){
  var before=JSON.parse(S.settingsSnap),out=[];
  [].forEach.call($('srows').children,function(row,i){
    var a=boundary(before[i]),b=boundary(rowHours(row));
    if(a!==b)out.push(row.dataset.store+'　'+fmtMin(a)+' → '+fmtMin(b));
  });
  return out;
}
function upd(row){
  var h=rowHours(row),ok=h.open&&h.close;
  row.querySelectorAll('label')[1].firstChild.textContent=ok&&toMin(h.close)<=toMin(h.open)?'閉店（翌日）':'閉店';
  row.querySelector('.cut').textContent=ok?'営業日の切り替え '+fmtMin(boundary(h)):'時刻を入れてください';
  if(S.settingsSnap!=null)dirty();
}
function saveSettings(){
  var stores={},bad=false;
  [].forEach.call($('srows').children,function(row){var h=rowHours(row);if(!h.open||!h.close)bad=true;stores[row.dataset.store]=h;});
  if(bad){$('serr').textContent='時刻が空の店舗があります';return;}
  // 営業日の切り替えが変わるときだけ、1回確認する
  var ch=cutChanges();
  if(ch.length&&!S.confirming){
    var box=$('sconf');box.textContent='';box.appendChild(el('div','','営業日の切り替えが変わります'));
    ch.forEach(function(t){box.appendChild(el('div','',t));});
    box.hidden=false;$('ssave').textContent='変更して保存';S.confirming=true;return;
  }
  $('ssave').disabled=true;$('serr').textContent='';
  call('saveSettings',[stores],function(s){
    S.settings=s;$('ssave').disabled=false;S.confirming=false;$('overlay').hidden=true;build();render();
  },function(e){$('ssave').disabled=false;$('serr').textContent='保存できませんでした：'+(e&&e.message||e);});
}

/* ---------- サーバー ---------- */
function call(fn,args,ok,ng){
  if(window.google&&google.script&&google.script.run){
    var r=google.script.run.withSuccessHandler(ok).withFailureHandler(ng);r[fn].apply(r,args);
  }else if(window.MOCK){setTimeout(function(){try{ok(window.MOCK[fn].apply(null,args));}catch(e){ng(e);}},50);}
  else fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
    .then(function(r){if(!r.ok)throw new Error('サーバーにつながりません（'+r.status+'）');return r.json();})
    .then(function(j){if(!j.ok)throw new Error(j.error);ok(j.result);}).catch(ng);
}
function load(){
  $('loading').hidden=false;$('loading').textContent='';$('loading').appendChild(el('b','','読み込み中'));$('main').hidden=true;
  $('loading').setAttribute('role','status');
  call('getAll',[],function(d){
    S.raw=d.rows||[];S.settings=d.settings||S.settings;S.synced=d.synced||'';
    build();$('loading').hidden=true;$('main').hidden=false;render();
  },function(e){
    $('loading').textContent='';$('loading').appendChild(el('b','','読み込めませんでした'));
    $('loading').appendChild(document.createTextNode(String(e&&e.message||e)));
  });
}
$('reload').onclick=load;
$('gear').onclick=openSettings;
$('scancel').onclick=function(){$('overlay').hidden=true;};
$('overlay').onclick=function(e){if(e.target===$('overlay'))$('overlay').hidden=true;};
document.addEventListener('keydown',function(e){if(e.key==='Escape')$('overlay').hidden=true;});
$('ssave').onclick=saveSettings;
$('csv').onclick=downloadCsv;
$('more').onclick=function(){S.limit+=PAGE;render();};
$('from').onchange=function(){S.from=this.value;S.limit=PAGE;render();};
$('to').onchange=function(){S.to=this.value;S.limit=PAGE;render();};
$('scroll').addEventListener('scroll',hint,{passive:true});window.addEventListener('resize',hint);
window.__casaPoint={build:build,render:render,csvText:csvText,periodRange:periodRange,S:S,boundary:boundary,bizDate:bizDate,makeView:makeView};
load();
})();
</script>
